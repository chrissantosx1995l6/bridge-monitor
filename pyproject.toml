[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-monitor"
version = "0.2.1"
description = "Small background prober for legacy HTTP/TCP endpoints"
authors = [{ name = "Alex", email = "alex@local" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
bridge-monitor = "bridge_monitor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
